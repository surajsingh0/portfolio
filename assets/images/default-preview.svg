<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001100;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0.05" />
        </linearGradient>
    </defs>
    
    <!-- Background with subtle gradient -->
    <rect width="100%" height="100%" fill="url(#bgGrad)"/>
    
    <!-- Decorative grid pattern -->
    <path d="M0 200 L800 200 M400 0 L400 400" 
          stroke="#00ff00" stroke-width="0.5" stroke-opacity="0.1"/>
    
    <!-- Central icon container with glow effect -->
    <circle cx="400" cy="170" r="60" 
            fill="url(#glowGrad)" 
            stroke="#00ff00" 
            stroke-width="1.5"
            stroke-opacity="0.6"/>
    
    <!-- Stylized image icon -->
    <g transform="translate(400,170)" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.8" fill="none">
        <rect x="-30" y="-25" width="60" height="50" rx="4"/>
        <path d="M-30 -5 L60 -5"/>
        <circle cx="15" cy="-15" r="5"/>
        <path d="M-20 10 L0 30 L20 15"/>
    </g>
    
    <!-- Text elements -->
    <text x="400" y="280" 
          text-anchor="middle" 
          font-family="'Roboto Mono', monospace" 
          font-size="24" 
          fill="#00ff00" 
          fill-opacity="0.9">
        Preview Unavailable
    </text>
    <text x="400" y="310" 
          text-anchor="middle" 
          font-family="'Roboto Mono', monospace" 
          font-size="14" 
          fill="#00ff00" 
          fill-opacity="0.6">
        Coming Soon
    </text>
</svg> 